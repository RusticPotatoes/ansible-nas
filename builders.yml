---
# Machines that build for the others (the `builders` group): Docker for image builds that the
# laptop drives through a Docker context, and Rust for cargo. Docker's install needs sudo, so
# run with -K: `make builders`. See website/docs/applications/development-tools/build-host.md.
- name: Build machines
  hosts: builders
  become: false
  pre_tasks:
    # Ubuntu 25.10 and later run sudo-rs as `sudo`, whose password prompt Ansible doesn't
    # recognise (it times out "waiting for privilege escalation prompt"). They keep the
    # classic sudo as sudo.ws: use it where it's there.
    - name: Find the classic sudo
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: builders_sudo_ws
      tags: [always]

    - name: Use it for become
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when: builders_sudo_ws.stat.exists
      tags: [always]

  roles:
    - role: geerlingguy.docker
      become: true
      vars:
        docker_users: ["{{ ansible_user_id }}"]
        docker_install_compose_plugin: true
        docker_daemon_options:
          builder:
            gc:
              enabled: true
              defaultKeepStorage: "{{ build_host_build_cache_keep }}"
      tags:
        - docker
        - skip_ansible_lint
    - role: build_host
      tags:
        - build_host
