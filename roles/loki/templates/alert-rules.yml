groups:
  - name: loki_alerts
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate({job="loki"} |= "error" [5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected in Loki"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
      
      - alert: LokiDown
        expr: |
          up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"
          description: "Loki instance has been down for more than 1 minute"
