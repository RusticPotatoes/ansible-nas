---
server:
  http_listen_port: {{ loki_http_port }}
  log_level: {{ loki_log_level }}

schema_config:
  configs:
    - from: 2021-08-01
      store: boltdb-shipper
      object_store: s3
      schema: v11
      index:
        prefix: index_
        period: 24h

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    s3:
      endpoint: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ minio_api_port }}"
      insecure: true
      bucketnames: loki-data
      access_key_id: "{{ minio_admin_username }}"
      secret_access_key: "{{ minio_admin_password }}"
      s3forcepathstyle: true
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s

limits_config:
  allow_structured_metadata: false
  split_queries_by_interval: 24h
  max_query_parallelism: 32

ruler:
  rule_path: /loki/rules
  storage:
    s3:
      bucketnames: loki-ruler

table_manager:
  retention_deletes_enabled: true
  retention_period: {{ loki_log_retention }}
