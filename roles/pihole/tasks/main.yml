---
- name: Start pihole
  block:

    - name: Check the Pi-hole macvlan address is set
      ansible.builtin.assert:
        that:
          - pihole_macvlan_address | default('') | length > 0
        fail_msg: "pihole_macvlan_address must be set when pihole_enabled is true (Pi-hole's LAN address, e.g. in group_vars)."
      when: pihole_enabled is true

    - name: Create macvlan network for Pi-hole
      community.docker.docker_network:
        name: pihole_macvlan
        driver: macvlan
        driver_options:
          parent: "{{ primary_eth }}"  # Change to match your network interface
        ipam_config:
          - subnet: "{{ ansible_nas_subnet }}"  # Adjust based on your network
            gateway: "{{ ansible_nas_gateway }}"  # Set your router's IP
      when: pihole_enabled is true

    - name: Create pihole Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ pihole_config_directory }}"
        - "{{ pihole_dnsmasq_directory }}"

    - name: Deploy Pi-hole Docker Container
      community.docker.docker_container:
        name: "{{ pihole_container_name }}"
        image: "pihole/pihole:latest"
        pull: true
        networks:
          - name: pihole_macvlan
            ipv4_address: "{{ pihole_macvlan_address }}"
        volumes:
          - "{{ pihole_config_directory }}:/etc/pihole:rw"
          - "{{ pihole_dnsmasq_directory }}:/etc/dnsmasq.d:rw"
        ports:
          - "53:53/tcp"
          - "53:53/udp"
          - "67:67/udp"
          - "80:80/tcp"
        # Pi-hole v6 ignores WEBPASSWORD; local records and router forwarding only when declared.
        env: >-
          {{ {'TZ': pihole_timezone,
              'WEBPASSWORD': pihole_web_password,
              'FTLCONF_webserver_api_password': pihole_web_password}
             | combine({'FTLCONF_dns_hosts': pihole_dns_hosts | join(';')} if pihole_dns_hosts else {})
             | combine({'FTLCONF_dns_revServers': pihole_rev_servers | join(';')} if pihole_rev_servers else {}) }}
        capabilities:
          - "NET_ADMIN"
        restart_policy: unless-stopped
        memory: "{{ pihole_memory }}"
        labels:
          homepage.group: Networking
          homepage.name: Pi-hole
          homepage.icon: pi-hole
          homepage.href: "http://{{ pihole_macvlan_address }}/admin"
          homepage.widget.type: pihole
          homepage.widget.url: "http://{{ pihole_macvlan_address }}"
          homepage.widget.version: "6"
          homepage.widget.key: "{{ pihole_web_password | default('') }}"
          homepage.description: DNS filtering
      when: pihole_enabled is true
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
- name: Stop pihole
  block:
    - name: Stop pihole
      community.docker.docker_container:
        name: "{{ pihole_container_name }}"
        state: absent
  when: pihole_enabled is false
