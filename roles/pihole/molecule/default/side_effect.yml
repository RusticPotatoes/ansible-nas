---
- name: Stop
  hosts: all
  become: true
  tasks:
    - name: "Include {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }} role"
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        pihole_enabled: false
        pihole_macvlan_address: "192.0.2.2"
