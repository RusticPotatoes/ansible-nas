---
- name: Start Deluge
  block:
    - name: Create Deluge config directory
      ansible.builtin.file:
        path: "{{ deluge_config_directory }}"
        state: directory
        owner: "{{ deluge_user_id }}"
        group: "{{ deluge_group_id }}"
        mode: "0775"
        recurse: true

    - name: Create Deluge download directory
      ansible.builtin.file:
        path: "{{ deluge_download_directory }}"
        state: directory
        owner: "{{ deluge_user_id }}"
        group: "{{ deluge_group_id }}"
        mode: "0775"

    - name: Deluge Docker Container
      community.docker.docker_container:
        name: deluge
        image: linuxserver/deluge
        pull: "{{ docker_container_pull | default(true) }}"
        volumes:
          - "{{ deluge_config_directory }}:/config:rw"
          - "{{ deluge_download_directory }}:/downloads:rw"
        ports: "{{ [deluge_port ~ ':8112'] if not (vpn_download_stack_enabled | default(false) | bool) else omit }}"
        network_mode: "{{ gluetun_name if (vpn_download_stack_enabled | default(false) | bool) else omit }}"
        env:
          TZ: "{{ deluge_timezone }}"
          PUID: "{{ deluge_user_id }}"
          PGID: "{{ deluge_group_id }}"
        restart_policy: unless-stopped
        memory: "{{ deluge_memory }}"
        labels:
          traefik.enable: "{{ deluge_available_externally | string }}"
          traefik.http.routers.deluge.rule: "Host(`{{ deluge_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.deluge.tls.certresolver: "letsencrypt"
          traefik.http.routers.deluge.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.deluge.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.deluge.loadbalancer.server.port: "8112"
          homepage.group: Download Tools
          homepage.name: Deluge
          homepage.icon: deluge.png
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ deluge_port }}"
          homepage.description: BitTorrent client
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: deluge_enabled is true
- name: Stop Deluge
  block:
    - name: Stop Deluge
      community.docker.docker_container:
        name: "{{ deluge_container_name }}"
        state: absent
  when: deluge_enabled is false
