---
- name: Start Gatus
  block:
    - name: Create Gatus data directory
      ansible.builtin.file:
        path: "{{ gatus_data_directory }}"
        state: directory

    - name: Create Gatus config
      ansible.builtin.template:
        src: config.yml.j2
        dest: "{{ gatus_config_file }}"
        backup: true
      register: gatus_config

    - name: Gatus Docker Container
      community.docker.docker_container:
        name: "{{ gatus_container_name }}"
        image: "{{ gatus_image_name }}:{{ gatus_image_version }}"
        pull: "{{ docker_container_pull | default(true) }}"
        state: started
        restart: "{{ gatus_config is changed }}"
        restart_policy: unless-stopped
        memory: "{{ gatus_memory }}"

        ports: "{{ [gatus_port ~ ':8080'] if not (gatus_use_vpn | default(false) | bool) else omit }}"
        network_mode: "{{ gluetun_name if (gatus_use_vpn | default(false) | bool) else omit }}"

        env:
          TZ: "{{ ansible_nas_timezone }}"
          GATUS_CONFIG_PATH: "/config/config.yaml"

        volumes:
          - "{{ gatus_config_file }}:/config/config.yaml:ro"

        labels:
          traefik.enable: "{{ gatus_available_externally | string }}"
          traefik.http.routers.gatus.rule: "Host(`{{ gatus_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.gatus.tls.certresolver: "letsencrypt"
          traefik.http.routers.gatus.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.gatus.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.gatus.loadbalancer.server.port: "8080"

          homepage.group: "Monitoring"
          homepage.name: "Gatus"
          homepage.icon: "gatus"
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ gatus_port }}"
          homepage.description: "Synthetic monitoring dashboard"

      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"

  when: gatus_enabled is true

- name: Stop Gatus
  block:
    - name: Stop Gatus
      community.docker.docker_container:
        name: "{{ gatus_container_name }}"
        state: absent

  when: gatus_enabled is false
