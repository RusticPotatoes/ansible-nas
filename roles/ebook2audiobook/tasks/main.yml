---
- name: Start ebook2audiobook
  block:
    - name: Create ebook2audiobook Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ ebook2audiobook_data_directory }}"
        - "{{ ebook2audiobook_models_directory }}"
        - "{{ ebook2audiobook_voices_directory }}"
        - "{{ ebook2audiobook_tmp_directory }}"
        - "{{ ebook2audiobook_audiobooks_directory }}"

    - name: Create ebook2audiobook seeded voice directory
      ansible.builtin.file:
        path: "{{ ebook2audiobook_seed_voice_directory }}"
        state: directory
      when: ebook2audiobook_seed_voice_source | length > 0

    - name: Convert seeded ebook2audiobook voice to app format
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --entrypoint ffmpeg
          -v {{ ebook2audiobook_seed_voice_source | dirname }}:/voice-source:ro
          -v {{ ebook2audiobook_seed_voice_directory }}:/voice-output:rw
          {{ ebook2audiobook_image_name }}:{{ ebook2audiobook_image_version }}
          -hide_banner -nostats -y
          -i /voice-source/{{ ebook2audiobook_seed_voice_source | basename }}
          -ac 1 -ar 24000
          /voice-output/{{ ebook2audiobook_seed_voice_path | basename }}
      args:
        creates: "{{ ebook2audiobook_seed_voice_path }}"
      when: ebook2audiobook_seed_voice_source | length > 0

    - name: Find existing ebook2audiobook voice files
      ansible.builtin.find:
        paths: "{{ ebook2audiobook_voices_directory }}"
        patterns: "*_24000.wav"
        recurse: true
      register: ebook2audiobook_existing_voices

    - name: Seed ebook2audiobook built-in voices
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --entrypoint /bin/sh
          -v {{ ebook2audiobook_voices_directory }}:/voice-output:rw
          {{ ebook2audiobook_image_name }}:{{ ebook2audiobook_image_version }}
          -lc 'cp -a /app/voices/. /voice-output/.'
      when:
        - ebook2audiobook_seed_builtin_voices | bool
        - ebook2audiobook_existing_voices.matched == 0

    - name: Find ebook2audiobook discovered voice files
      ansible.builtin.find:
        paths: "{{ ebook2audiobook_voices_directory }}"
        patterns: "*_24000.wav"
        recurse: true
      register: ebook2audiobook_discovered_voices

    - name: Show ebook2audiobook discovered voice count
      ansible.builtin.debug:
        msg: >-
          ebook2audiobook discovered {{ ebook2audiobook_discovered_voices.matched }}
          voice file(s) under {{ ebook2audiobook_voices_directory }}.

    - name: ebook2audiobook Docker Container
      community.docker.docker_container:
        name: "{{ ebook2audiobook_container_name }}"
        image: "{{ ebook2audiobook_image_name }}:{{ ebook2audiobook_image_version }}"
        pull: true
        volumes:
          - "{{ ebook2audiobook_books_directory }}:/app/ebooks:rw"
          - "{{ ebook2audiobook_audiobooks_directory }}:/app/audiobooks:rw"
          - "{{ ebook2audiobook_models_directory }}:/app/models:rw"
          - "{{ ebook2audiobook_voices_directory }}:/app/voices:rw"
          - "{{ ebook2audiobook_tmp_directory }}:/app/tmp:rw"
        ports:
          - "{{ ebook2audiobook_port }}:7860"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          PUID: "{{ ebook2audiobook_user_id }}"
          PGID: "{{ ebook2audiobook_group_id }}"
          NVIDIA_VISIBLE_DEVICES: "{{ ebook2audiobook_nvidia_visible_devices }}"
          NVIDIA_DRIVER_CAPABILITIES: "{{ ebook2audiobook_nvidia_driver_capabilities }}"
        restart_policy: unless-stopped
        device_requests: "{{ ebook2audiobook_device_requests if (ebook2audiobook_gpu_enabled | bool) else omit }}"
        memory: "{{ ebook2audiobook_memory }}"
        labels:
          traefik.enable: "{{ ebook2audiobook_available_externally | string }}"
          traefik.http.routers.ebook2audiobook.rule: "Host(`{{ ebook2audiobook_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.ebook2audiobook.tls.certresolver: "letsencrypt"
          traefik.http.routers.ebook2audiobook.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.ebook2audiobook.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.ebook2audiobook.loadbalancer.server.port: "7860"
          homepage.group: AI
          homepage.name: eBook2AudioBook
          homepage.icon: audiobook
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ ebook2audiobook_port }}"
          homepage.description: Convert ebooks into audiobooks

      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: ebook2audiobook_enabled is true
- name: Stop ebook2audiobook
  block:
    - name: Stop ebook2audiobook
      community.docker.docker_container:
        name: "{{ ebook2audiobook_container_name }}"
        state: absent
  when: ebook2audiobook_enabled is false
