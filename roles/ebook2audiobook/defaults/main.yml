---
ebook2audiobook_enabled: false
ebook2audiobook_available_externally: false

# directories
ebook2audiobook_books_directory: "{{ books_root }}"
ebook2audiobook_audiobooks_directory: "{{ audiobooks_root }}"
ebook2audiobook_download_directory: "{{ downloads_root }}"
ebook2audiobook_data_directory: "{{ docker_home }}/ebook2audiobook"
ebook2audiobook_models_directory: "{{ ebook2audiobook_data_directory }}/models"
ebook2audiobook_voices_directory: "{{ ebook2audiobook_data_directory }}/voices"
ebook2audiobook_tmp_directory: "{{ ebook2audiobook_data_directory }}/tmp"
ebook2audiobook_processed_directory: "{{ ebook2audiobook_data_directory }}/processed"

# Automatic conversion. A systemd timer scans the books directory and runs
# ebook2audiobook headless for ebook files that do not have a success marker.
ebook2audiobook_auto_convert_enabled: false
ebook2audiobook_auto_convert_interval: "30m"
ebook2audiobook_auto_convert_script_path: "/usr/local/sbin/ebook2audiobook-auto-convert"
ebook2audiobook_auto_convert_language: "eng"
ebook2audiobook_auto_convert_device: "{{ 'gpu' if (ebook2audiobook_gpu_enabled | bool) else 'cpu' }}"
ebook2audiobook_auto_convert_output_format: "m4b"
ebook2audiobook_auto_convert_output_directory: "/app/audiobooks/auto"
ebook2audiobook_auto_convert_host_output_directory: "{{ ebook2audiobook_audiobooks_directory }}/auto"
ebook2audiobook_auto_convert_timeout: "2h"
ebook2audiobook_auto_convert_extensions:
  - epub
  - mobi
  - azw3
  - pdf
  - txt

# Copy the image's built-in voices into the persistent host voice directory
# when it is empty. Without this, the /app/voices bind mount hides voices that
# are baked into the container image and the UI shows "none".
ebook2audiobook_seed_builtin_voices: true

# Optional voice seed. The app lists custom/builtin voices from:
# voices/<language>/<age>/<gender>/<name>_24000.wav
# Set ebook2audiobook_seed_voice_source to a local audio file you have rights to
# use, and Ansible will convert it to the expected 24 kHz mono wav format.
ebook2audiobook_seed_voice_source: ""
ebook2audiobook_seed_voice_name: "Narrator"
ebook2audiobook_seed_voice_language: "eng"
ebook2audiobook_seed_voice_age: "adult"
ebook2audiobook_seed_voice_gender: "male"
ebook2audiobook_seed_voice_safe_name: "{{ ebook2audiobook_seed_voice_name | regex_replace('[^A-Za-z0-9_-]', '') }}"
ebook2audiobook_seed_voice_directory: "{{ ebook2audiobook_voices_directory }}/{{ ebook2audiobook_seed_voice_language }}/{{ ebook2audiobook_seed_voice_age }}/{{ ebook2audiobook_seed_voice_gender }}"
ebook2audiobook_seed_voice_path: "{{ ebook2audiobook_seed_voice_directory }}/{{ ebook2audiobook_seed_voice_safe_name }}_24000.wav"

# uid / gid
ebook2audiobook_user_id: "0"
ebook2audiobook_group_id: "0"

# network
ebook2audiobook_port: "7860"
ebook2audiobook_hostname: "ebook2audiobook"

# docker
ebook2audiobook_container_name: "ebook2audiobook"
ebook2audiobook_image_name: "athomasson2/ebook2audiobook"
ebook2audiobook_image_version: "cuda12-v25.5.29"
ebook2audiobook_gpu_enabled: true
ebook2audiobook_nvidia_visible_devices: "all"
ebook2audiobook_nvidia_driver_capabilities: "compute,utility"
ebook2audiobook_device_requests:
  - driver: nvidia
    count: -1
    capabilities:
      - ["gpu"]

# specs
ebook2audiobook_memory: 8g
