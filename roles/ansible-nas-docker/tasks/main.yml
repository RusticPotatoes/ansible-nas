---
- name: Install python3-venv and python3-pip
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv  # Ensure virtual environment package is installed
    state: present
  register: result
  until: result is succeeded

- name: Create virtual environment for Ansible
  ansible.builtin.command:
    cmd: python3 -m venv /opt/ansible-venv
  args:
    creates: /opt/ansible-venv

- name: Upgrade pip inside the virtual environment
  ansible.builtin.command:
    cmd: /opt/ansible-venv/bin/python -m pip install --upgrade pip
  register: result
  until: result is succeeded

- name: Remove docker-py python module (from venv)
  ansible.builtin.pip:
    name: docker-py
    state: absent
    virtualenv: /opt/ansible-venv
  register: result
  until: result is succeeded

- name: Install docker python module (in venv)
  ansible.builtin.pip:
    name: docker
    state: present
    virtualenv: /opt/ansible-venv
  register: result
  until: result is succeeded

- name: Create Docker home directory
  ansible.builtin.file:
    path: "{{ docker_home }}"
    mode: 0755
    state: directory

- name: Add user account to Docker group
  ansible.builtin.user:
    name: "{{ ansible_nas_user }}"
    groups: docker
    append: yes

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Configure Docker service environment
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/ansible-nas.conf
    mode: '0644'
    content: |
      [Service]
      {% for name, value in docker_systemd_environment.items() %}
      Environment="{{ name }}={{ value }}"
      {% endfor %}
  register: docker_systemd_config

- name: Generate Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}"
  register: docker_config

- name: Restart Docker # noqa no-handler
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when: docker_config.changed or docker_systemd_config.changed

# The periodic Docker prune is one of nas_maintenance's scheduled jobs (nas_scheduled_jobs).
