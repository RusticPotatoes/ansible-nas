---
- name: Install python3-venv and python3-pip
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv  # Ensure virtual environment package is installed
    state: present
  register: result
  until: result is succeeded

- name: Create virtual environment for Ansible
  ansible.builtin.command:
    cmd: python3 -m venv /opt/ansible-venv
  args:
    creates: /opt/ansible-venv

- name: Upgrade pip inside the virtual environment
  ansible.builtin.command:
    cmd: /opt/ansible-venv/bin/python -m pip install --upgrade pip
  register: result
  until: result is succeeded

- name: Remove docker-py python module (from venv)
  ansible.builtin.pip:
    name: docker-py
    state: absent
    virtualenv: /opt/ansible-venv
  register: result
  until: result is succeeded

- name: Install docker python module (in venv)
  ansible.builtin.pip:
    name: docker
    state: present
    virtualenv: /opt/ansible-venv
  register: result
  until: result is succeeded

- name: Create Docker home directory
  ansible.builtin.file:
    path: "{{ docker_home }}"
    mode: 0755
    state: directory

- name: Add user account to Docker group
  ansible.builtin.user:
    name: "{{ ansible_nas_user }}"
    groups: docker
    append: yes

- name: Generate Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}"
  register: docker_config

- name: Restart Docker # noqa no-handler
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_config.changed

- name: Install Docker prune script
  ansible.builtin.template:
    src: ansible-nas-docker-prune.sh.j2
    dest: "{{ docker_prune_script_path }}"
    owner: root
    group: root
    mode: '0755'
  when: docker_prune_enabled | bool

- name: Install Docker prune systemd service
  ansible.builtin.template:
    src: ansible-nas-docker-prune.service.j2
    dest: /etc/systemd/system/ansible-nas-docker-prune.service
    owner: root
    group: root
    mode: '0644'
  when: docker_prune_enabled | bool

- name: Install Docker prune systemd timer
  ansible.builtin.template:
    src: ansible-nas-docker-prune.timer.j2
    dest: /etc/systemd/system/ansible-nas-docker-prune.timer
    owner: root
    group: root
    mode: '0644'
  when: docker_prune_enabled | bool

- name: Enable Docker prune timer
  ansible.builtin.systemd:
    name: ansible-nas-docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: docker_prune_enabled | bool

- name: Disable Docker prune timer
  ansible.builtin.systemd:
    name: ansible-nas-docker-prune.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when: not (docker_prune_enabled | bool)
