---
ansible_nas_user: david

# Where you want to store application data - you'll likely want this backed up or on a ZFS zpool.
docker_home: /mnt/docker

# Where you want Docker to store images
# Keep this on a fast disk, ideally an SSD. It doesn't need to be backed up.
docker_image_directory: "/mnt/docker/docker-data/"

# Docker storage driver, see https://docs.docker.com/storage/storagedriver/select-storage-driver/#supported-backing-filesystems
# You might want to change this to ZFS, depending on your underlying filesystem.
docker_storage_driver: overlay2

docker_daemon_json:
  data-root: "{{ docker_image_directory }}"
  storage-driver: "{{ docker_storage_driver }}"

docker_systemd_environment:
  GODEBUG: "netdns=cgo"

# Periodic Docker cleanup. This intentionally does not prune volumes by
# default, because many Ansible-NAS apps keep important state in volumes/binds.
docker_prune_enabled: false
docker_prune_interval: "weekly"
docker_prune_script_path: "/usr/local/sbin/ansible-nas-docker-prune"
docker_prune_until: "168h"
docker_prune_images: true
docker_prune_containers: true
docker_prune_networks: true
docker_prune_build_cache: true
docker_prune_volumes: false
