---
- name: Start OwnTone
  block:
    - name: Create OwnTone Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ owntone_user_id }}"
        group: "{{ owntone_group_id }}"
      with_items:
        - "{{ owntone_data_directory }}"
        - "{{ owntone_config_directory }}"
        - "{{ owntone_cache_directory }}"
        - "{{ owntone_pipe_directory }}"
        - "{{ owntone_spotify_credentials_directory }}"
        - "{{ owntone_spotify_scripts_directory }}"

    # The .metadata pipe carries track details; OwnTone pairs it with the
    # audio pipe of the same name.
    - name: Create Spotify Pipes
      ansible.builtin.command:
        cmd: "mkfifo -m 0666 {{ owntone_pipe_directory }}/{{ item }}"
        creates: "{{ owntone_pipe_directory }}/{{ item }}"
      with_items:
        - "{{ owntone_pipe_name }}"
        - "{{ owntone_pipe_name }}.metadata"

    - name: Set Spotify Pipe Permissions
      ansible.builtin.file:
        path: "{{ owntone_pipe_directory }}/{{ item }}"
        owner: "{{ owntone_user_id }}"
        group: "{{ owntone_group_id }}"
        mode: "0666"
      with_items:
        - "{{ owntone_pipe_name }}"
        - "{{ owntone_pipe_name }}.metadata"

    - name: Copy Spotify Track Details Script
      ansible.builtin.copy:
        src: owntone-metadata.py
        dest: "{{ owntone_spotify_scripts_directory }}/owntone-metadata.py"
        mode: "0755"

    - name: Create OwnTone Docker Container
      community.docker.docker_container:
        name: "{{ owntone_container_name }}"
        image: "{{ owntone_image_name }}:{{ owntone_image_version }}"
        pull: true
        volumes:
          - "{{ owntone_config_directory }}:/etc/owntone"
          - "{{ owntone_cache_directory }}:/var/cache/owntone"
          - "{{ owntone_pipe_directory }}:/srv/media"
        network_mode: "host"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          UID: "{{ owntone_user_id }}"
          GID: "{{ owntone_group_id }}"
        restart_policy: unless-stopped
        memory: "{{ owntone_memory }}"
        labels:
          traefik.enable: "{{ owntone_available_externally | string }}"
          traefik.http.routers.owntone.rule: "Host(`{{ owntone_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.owntone.tls.certresolver: "letsencrypt"
          traefik.http.routers.owntone.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.owntone.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.owntone.loadbalancer.server.port: "{{ owntone_port }}"

    # The container writes its default config on first start.
    - name: Wait For OwnTone Config
      ansible.builtin.wait_for:
        path: "{{ owntone_config_directory }}/owntone.conf"
        timeout: 60

    - name: Set OwnTone AirPlay User Agent
      ansible.builtin.lineinfile:
        path: "{{ owntone_config_directory }}/owntone.conf"
        regexp: '^\s*user_agent\s*='
        # owntone.conf indents its settings with a tab.
        line: "\tuser_agent = \"{{ owntone_airplay_user_agent }}\""  # noqa: no-tabs
        insertafter: '^general \{'
      register: owntone_config

    # Not a handler: OwnTone restarts with its new setting before the Spotify receiver below starts.
    - name: Restart OwnTone For Config Change  # noqa: no-handler
      community.docker.docker_container:
        name: "{{ owntone_container_name }}"
        state: started
        restart: true
      when: owntone_config.changed

    - name: Check For Saved Spotify Login
      ansible.builtin.stat:
        path: "{{ owntone_spotify_credentials_directory }}/credentials.json"
      register: owntone_spotify_credentials

    # Without discovery librespot can only start from a saved login, so wait
    # for the one-time login described in the docs instead of restart-looping.
    - name: Create Spotify Connect Docker Container
      community.docker.docker_container:
        name: "{{ owntone_spotify_container_name }}"
        image: "{{ owntone_spotify_image_name }}:{{ owntone_spotify_image_version }}"
        pull: true
        volumes:
          - "{{ owntone_pipe_directory }}:/pipes"
          - "{{ owntone_spotify_credentials_directory }}:/data/system-cache"
          - "{{ owntone_spotify_scripts_directory }}:/userscripts:ro"
        network_mode: "host"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          DEVICE_NAME: "{{ owntone_spotify_device_name }}"
          BACKEND: "pipe"
          DEVICE: "/pipes/{{ owntone_pipe_name }}"
          FORMAT: "S16"
          BITRATE: "{{ owntone_spotify_bitrate }}"
          INITIAL_VOLUME: "{{ owntone_spotify_initial_volume }}"
          ENABLE_SYSTEM_CACHE: "Y"
          DISABLE_AUDIO_CACHE: "Y"
          DISABLE_DISCOVERY: "{{ 'N' if owntone_spotify_discovery else 'Y' }}"
          ONEVENT_COMMAND: "owntone-metadata.py"
          OWNTONE_METADATA_PIPE: "/pipes/{{ owntone_pipe_name }}.metadata"
        restart_policy: unless-stopped
        memory: "{{ owntone_spotify_memory }}"
      when: owntone_spotify_discovery or owntone_spotify_credentials.stat.exists

    - name: Remove Spotify Connect Docker Container Until Logged In
      community.docker.docker_container:
        name: "{{ owntone_spotify_container_name }}"
        state: absent
      when: not (owntone_spotify_discovery or owntone_spotify_credentials.stat.exists)

    - name: Explain Spotify Login
      ansible.builtin.debug:
        msg: >-
          The Spotify Connect receiver is not running yet because no Spotify login is saved in
          {{ owntone_spotify_credentials_directory }}. Run the one-time login from the OwnTone docs, then re-run the playbook.
      when: not (owntone_spotify_discovery or owntone_spotify_credentials.stat.exists)
  when: owntone_enabled is true

- name: Stop OwnTone
  block:
    - name: Stop OwnTone
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      with_items:
        - "{{ owntone_spotify_container_name }}"
        - "{{ owntone_container_name }}"
  when: owntone_enabled is false
