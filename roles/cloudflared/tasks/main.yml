---
- name: Start Cloudflared
  block:
    - name: Remind when the tunnel token is not set yet
      ansible.builtin.debug:
        msg: >-
          cloudflared: set vault_cloudflared_tunnel_token in vault.yml (from your
          Cloudflare Zero Trust tunnel) to deploy the connector.
      when: cloudflared_tunnel_token | length == 0

    - name: Cloudflared Docker Container
      community.docker.docker_container:
        name: "{{ cloudflared_container_name }}"
        image: "{{ cloudflared_image_name }}:{{ cloudflared_image_version }}"
        pull: "{{ docker_container_pull | default(true) }}"
        command: "tunnel --no-autoupdate run"
        env:
          TUNNEL_TOKEN: "{{ cloudflared_tunnel_token }}"
        restart_policy: unless-stopped
        memory: "{{ cloudflared_memory }}"
        labels:
          homepage.group: Networking
          homepage.name: Cloudflare Tunnel
          homepage.icon: cloudflare-zero-trust
          homepage.description: Outbound-only remote access (no open ports)
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
      when: cloudflared_tunnel_token | length > 0
  when: cloudflared_enabled is true
- name: Stop Cloudflared
  block:
    - name: Stop Cloudflared
      community.docker.docker_container:
        name: "{{ cloudflared_container_name }}"
        state: absent
  when: cloudflared_enabled is false
