---
# OpenBao's server configuration, handed over as JSON in BAO_LOCAL_CONFIG so nothing is mounted
# into a read-only container; OpenBao reads JSON as HCL. Role vars, not defaults: these are the
# decisions Endora ADR 0127 records, and two of them must not change on existing data.
openbao_config:
  ui: false
  # mlock would need IPC_LOCK, and the container has no capabilities; swap is the host's.
  disable_mlock: true
  # Integrated storage, single node. The node id is the one the storage was made with, under
  # Endora's role: raft only opens under it. Never change it on existing data.
  storage:
    raft:
      path: /openbao/file
      node_id: endora
  # Plain HTTP on the vault's internal network (ADR 0127 says why TLS waits for PKI). The
  # unauthenticated rekey endpoints are on for the break-glass recovery, which rekeys with the
  # shares; anyone who reaches them could start or cancel a rekey, never finish one.
  listener:
    - tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
        disable_unauthed_rekey_endpoints: false
  api_addr: "http://{{ openbao_alias }}:8200"
  cluster_addr: "http://127.0.0.1:8201"
  # Every request and answer, values HMAC'd, beside the storage. The device keeps the path it
  # was declared with under Endora's role, so it stays the same device.
  audit:
    - type: file
      path: endora-audit
      options:
        file_path: /openbao/file/audit.log
