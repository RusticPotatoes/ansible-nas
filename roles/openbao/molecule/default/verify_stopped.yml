---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Include the role's defaults
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove OpenBao
      community.docker.docker_container:
        name: "{{ openbao_container_name }}"
        state: absent
      register: result

    - name: Check OpenBao is stopped
      ansible.builtin.assert:
        that:
          - not result.changed
