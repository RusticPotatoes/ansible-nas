---
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ stats_prometheus_port }}
    uid: ansible_nas
    isDefault: true
    version: 4
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:3100
    uid: loki
    version: 2
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "1"

deleteDatasources:
  - name: "InfluxDB"
    orgId: 1
