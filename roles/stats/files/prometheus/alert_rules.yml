---
# Alert rules evaluated by Prometheus. Firing alerts are shown on the Homepage
# "Alerts" card (Prometheus ALERTS series). The `subject` label is what the card
# displays next to the alert name.
groups:
  - name: storage
    rules:
      - alert: DiskFailingSmart
        expr: smartprom_smart_passed == 0
        for: 10m
        labels:
          severity: critical
          subject: "{{ $labels.drive }} {{ $labels.model_name }}"
        annotations:
          summary: "{{ $labels.drive }} ({{ $labels.model_name }}) is failing its SMART health check"

      - alert: SsdWearHigh
        expr: smartprom_percentage_used >= 90
        for: 1h
        labels:
          severity: warning
          subject: "{{ $labels.drive }} {{ $value }}% used"
        annotations:
          summary: "{{ $labels.drive }} ({{ $labels.model_name }}) has used {{ $value }}% of its rated write endurance"

      - alert: DiskBadSectors
        expr: smartprom_reallocated_sector_ct_raw > 0 or smartprom_current_pending_sector_raw > 0 or smartprom_offline_uncorrectable_raw > 0
        for: 10m
        labels:
          severity: warning
          subject: "{{ $labels.drive }}"
        annotations:
          summary: "{{ $labels.drive }} ({{ $labels.model_name }}) reports reallocated, pending or uncorrectable sectors"

      - alert: SataCrcErrorsRising
        expr: increase(smartprom_udma_crc_error_count_raw[24h]) > 0
        labels:
          severity: warning
          subject: "{{ $labels.drive }}"
        annotations:
          summary: "{{ $labels.drive }} UDMA CRC errors increased in the last 24h (check SATA cable/port)"

      - alert: DiskTemperatureHigh
        expr: smartprom_temperature_celsius_raw > 50
        for: 15m
        labels:
          severity: warning
          subject: "{{ $labels.drive }} {{ $value }}°C"
        annotations:
          summary: "{{ $labels.drive }} is at {{ $value }}°C"

      - alert: FilesystemAlmostFull
        expr: disk_used_percent{fstype=~"ext4|btrfs|xfs|vfat"} > 90
        for: 15m
        labels:
          severity: warning
          subject: "{{ $labels.path }} {{ printf \"%.0f\" $value }}%"
        annotations:
          summary: "{{ $labels.path }} is {{ printf \"%.0f\" $value }}% full"

      - alert: FilesystemFull
        expr: disk_used_percent{fstype=~"ext4|btrfs|xfs|vfat"} > 97
        for: 5m
        labels:
          severity: critical
          subject: "{{ $labels.path }} {{ printf \"%.0f\" $value }}%"
        annotations:
          summary: "{{ $labels.path }} is {{ printf \"%.0f\" $value }}% full"

  - name: system
    rules:
      - alert: LowMemory
        expr: mem_available_percent < 10
        for: 15m
        labels:
          severity: warning
          subject: "{{ printf \"%.0f\" $value }}% available"
        annotations:
          summary: "Only {{ printf \"%.0f\" $value }}% of memory is available"

      - alert: HighSwapUsage
        expr: swap_used_percent > 80
        for: 30m
        labels:
          severity: warning
          subject: "{{ printf \"%.0f\" $value }}% used"
        annotations:
          summary: "Swap is {{ printf \"%.0f\" $value }}% used"

  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: increase(docker_container_status_restart_count[15m]) > 3
        labels:
          severity: critical
          subject: "{{ $labels.container_name }}"
        annotations:
          summary: "{{ $labels.container_name }} restarted {{ printf \"%.0f\" $value }} times in 15 minutes"

      - alert: ContainerUnhealthy
        expr: docker_container_health_failing_streak > 3
        for: 5m
        labels:
          severity: warning
          subject: "{{ $labels.container_name }}"
        annotations:
          summary: "{{ $labels.container_name }} is failing its health check"

      - alert: ContainerMemoryNearLimit
        expr: docker_container_mem_usage_percent > 95
        for: 10m
        labels:
          severity: warning
          subject: "{{ $labels.container_name }} {{ printf \"%.0f\" $value }}%"
        annotations:
          summary: "{{ $labels.container_name }} is at {{ printf \"%.0f\" $value }}% of its memory limit"

  - name: monitoring
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          subject: "{{ $labels.job }}"
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"

      - alert: LokiLogMessagesDropped
        expr: rate(loki_log_messages_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          subject: "loki"
        annotations:
          summary: "Loki is dropping log messages"

  - name: backups
    rules:
      - alert: BackupStale
        expr: time() - backrest_snapshot_last_success > 36 * 3600
        labels:
          severity: warning
          subject: "{{ $labels.plan }}"
        annotations:
          summary: "Backup plan {{ $labels.plan }} last succeeded {{ $value | humanizeDuration }} ago"

      - alert: BackupNeverSucceeded
        expr: absent(backrest_snapshot_last_success{plan="system"})
        for: 36h
        labels:
          severity: warning
          subject: "system"
        annotations:
          summary: "The system backup plan has not completed a snapshot yet"

      - alert: DatabaseDumpStale
        expr: time() - nas_db_dump_last_success > 36 * 3600
        labels:
          severity: warning
          subject: "{{ $labels.db }}"
        annotations:
          summary: "{{ $labels.db }} dump last succeeded {{ $value | humanizeDuration }} ago"
