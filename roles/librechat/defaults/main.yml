---
librechat_enabled: false
librechat_available_externally: false

# directories
librechat_books_directory: "{{ books_root }}"
librechat_audiobooks_directory: "{{ audiobooks_root }}"
librechat_download_directory: "{{ downloads_root }}"
librechat_data_directory: "{{ docker_home }}/librechat"
mcpserver_data_directory: "{{ docker_home }}/mcp_server"

# uid / gid
librechat_user_id: "0"
librechat_group_id: "0"

# network
librechat_port: "3080"
librechat_hostname: "librechat"
librechat_ollama_base_url: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:11434/v1/"
librechat_applescript_mcp_url: ""
librechat_apple_mcp_url: ""

# docker
librechat_container_name: "librechat"
librechat_image_name: "librechat/librechat"
librechat_image_version: "latest"

# specs
librechat_memory: 4g

# Secrets. Set these in vault.yml before enabling LibreChat.
librechat_encryption_key: "{{ vault_librechat_encryption_key | default('') }}"
librechat_jwt_secret: "{{ vault_librechat_jwt_secret | default('') }}"
librechat_admin_email: "{{ vault_librechat_admin_email | default('admin@local.com') }}"
librechat_admin_password: "{{ vault_librechat_admin_password | default('') }}"
