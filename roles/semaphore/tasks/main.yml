---
- name: Start semaphore
  block:
    - name: Create semaphore Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ semaphore_user_id }}"
        group: "{{ semaphore_group_id }}"
      with_items:
        - "{{ semaphore_config_directory }}"
        - "{{ semaphore_data_directory }}"

    - name: Semaphore Docker Container
      community.docker.docker_container:
        name: "{{ semaphore_container_name }}"
        image: "{{ semaphore_image_name }}:{{ semaphore_image_version }}"
        pull: true
        user: "{{ semaphore_user_id }}:{{ semaphore_group_id }}"
        volumes:
          - "{{ semaphore_config_directory }}:/etc/semaphore:rw"
          - "{{ semaphore_data_directory }}:/var/lib/semaphore:rw"
        ports:
          - "{{ semaphore_port }}:3000"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          SEMAPHORE_DB_DIALECT: "postgres"
          SEMAPHORE_DB_HOST: "postgres"
          SEMAPHORE_DB_PORT: "5432"
          SEMAPHORE_DB_USER: "{{ postgres_user }}"
          SEMAPHORE_DB_PASS: "{{ postgres_password }}"
          SEMAPHORE_DB: "semaphore"
          SEMAPHORE_ADMIN: "{{ semaphore_admin_user }}"
          SEMAPHORE_ADMIN_PASSWORD: "{{ semaphore_admin_password }}"
          SEMAPHORE_ADMIN_EMAIL: "{{ semaphore_admin_email }}"
        restart_policy: unless-stopped
        memory: "{{ semaphore_memory }}"
        networks:
          - name: postgres_net
        labels:
          traefik.enable: "{{ semaphore_available_externally | string }}"
          traefik.http.routers.semaphore.rule: "Host(`{{ semaphore_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.semaphore.tls.certresolver: "letsencrypt"
          traefik.http.routers.semaphore.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.semaphore.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.semaphore.loadbalancer.server.port: "3000"
          homepage.group: System Tools
          homepage.name: Semaphore
          homepage.icon: semaphore
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ semaphore_port }}"
          homepage.description: Ansible automation UI
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: semaphore_enabled is true

- name: Stop semaphore
  block:
    - name: Stop semaphore
      community.docker.docker_container:
        name: "{{ semaphore_container_name }}"
        state: absent
  when: semaphore_enabled is false
