---
semaphore_enabled: false
semaphore_available_externally: false

# directories
# config.json (incl. the access key encryption secret) lives in /etc/semaphore,
# local data in /var/lib/semaphore. Both must survive container recreation.
semaphore_config_directory: "{{ docker_home }}/semaphore/config"
semaphore_data_directory: "{{ docker_home }}/semaphore/data"

# uid / gid the image runs as (user "semaphore", group root)
semaphore_user_id: "1001"
semaphore_group_id: "0"

# network
semaphore_port: "3333"
semaphore_hostname: "semaphore"

# docker
semaphore_container_name: "semaphore"
semaphore_image_name: "semaphoreui/semaphore"
semaphore_image_version: "v2.19.16"

# specs
semaphore_memory: 1g

# admin account
semaphore_admin_user: "{{ vault_semaphore_admin_user | default('admin') }}"
semaphore_admin_password: "{{ vault_semaphore_admin_password | default('') }}"
semaphore_admin_email: "{{ vault_semaphore_admin_email | default('admin@localhost') }}"
