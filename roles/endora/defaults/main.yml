---
# Endora, a self-hosted butler for the house: https://github.com/RusticPotatoes/Endora
#
# Checks out a branch or tag of Endora on the NAS, builds it there and starts it with the
# project's own docker-compose.yml. The Compose project name is the one Endora's
# `make deploy` uses, so both reach the same containers and the same data volume: a node
# deployed either way is the same node, and switching between them moves no data.
# See website/docs/applications/other/endora.md.
endora_enabled: false

endora_repo: https://github.com/RusticPotatoes/Endora.git
# A branch, tag or commit. The build is stamped with its short commit, which the console's
# header and /health show.
endora_version: develop
# Build again even when the checkout did not move (for example after a `make deploy` from
# another machine replaced the image).
endora_rebuild: false

# The checkout and the files this role writes. Endora's data is not kept here (below).
endora_root: "{{ docker_home }}/endora"
endora_project_name: endora

# Where the node keeps its database (every setting, key and sign-in secret) and TLS
# certificate. Empty: the Docker volume `<project>_endora-data`, which is outside your
# backups. To keep it in a folder your backups reach, copy the volume there first with
# Endora's `make migrate-data`, then set this: the role refuses to start the node on an
# empty folder while the volume still holds a database, because that would be a brand-new
# node.
endora_data_dir: ""

# The read-only mail copy kept by the mail_mirror role (Endora ADR 0097). Empty: no mail.
endora_mail_dir: "{{ (mail_mirror_root | default('/srv/mail-mirror')) ~ '/maildir' if (mail_mirror_enabled | default(false) | bool) else '' }}"

# An OpenAI-compatible model endpoint. The default is the ollama role on this host.
endora_model_url: http://host.docker.internal:11434/v1
endora_model: qwen2.5:7b

# Endora looking into things on its own and noticing the house's daily patterns (Endora
# ADR 0094-0096). The offset is your distance from UTC in minutes.
endora_own_work: false
endora_utc_offset_minutes: 0

# The address the node's self-signed certificate is issued for, so the browser warning is
# accepted once for the address you use. Empty: the certificate names localhost only.
endora_tls_san: "{{ ansible_default_ipv4.address | default('') }}"

# Endora's read-only view of the containers on this host (its `homelab` Compose profile):
# fixed GET routes over the Docker socket, nothing that starts, stops or execs.
endora_docker_observer: false
