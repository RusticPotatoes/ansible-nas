---
- name: Start Homepage
  block:
    - name: Create Homepage Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ homepage_data_directory }}"

    - name: Template config files
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ homepage_data_directory }}/{{ item }}"
      with_items:
        - bookmarks.yaml
        - docker.yaml
        - settings.yaml
        - services.yaml
        - widgets.yaml
      register: homepage_config

    - name: Create Homepage Docker Container
      community.docker.docker_container:
        name: "{{ homepage_container_name }}"
        image: "{{ homepage_image_name }}:{{ homepage_image_tag }}"
        pull: true
        volumes: "{{ [homepage_data_directory ~ ':/app/config', '/var/run/docker.sock:/var/run/docker.sock'] + homepage_extra_volumes }}"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          HOMEPAGE_ALLOWED_HOSTS: "{{ homepage_allowed_hosts }}"
          # Widget credentials reach Homepage here, never as container labels: a label is
          # visible to anything that reads container metadata, and Telegraf exports labels.
          # Homepage substitutes {{HOMEPAGE_VAR_NAME}} in widget settings from these.
          HOMEPAGE_VAR_WATCHTOWER_API_TOKEN: "{{ watchtower_api_token | default('') }}"
          HOMEPAGE_VAR_SONARR_API_KEY: "{{ sonarr_api_key | default('') }}"
          HOMEPAGE_VAR_RADARR_API_KEY: "{{ radarr_api_key | default('') }}"
          HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ prowlarr_api_key | default('') }}"
          HOMEPAGE_VAR_PLEX_TOKEN: "{{ plex_token | default('') }}"
          HOMEPAGE_VAR_PIHOLE_WEB_PASSWORD: "{{ pihole_web_password | default('') }}"
          HOMEPAGE_VAR_OVERSEERR_API_KEY: "{{ overseerr_api_key | default('') }}"
          HOMEPAGE_VAR_NZBGET_USER: "{{ nzbget_user | default('') }}"
          HOMEPAGE_VAR_NZBGET_PASS: "{{ nzbget_pass | default('') }}"
          HOMEPAGE_VAR_DELUGE_WEB_PASSWORD: "{{ deluge_web_password | default('deluge') }}"
          HOMEPAGE_VAR_BACKREST_UI_USERNAME: "{{ backrest_ui_username | default('') }}"
          HOMEPAGE_VAR_BACKREST_UI_PASSWORD: "{{ backrest_ui_password | default('') }}"
        ports:
          - "{{ homepage_port }}:3000"
        restart_policy: unless-stopped
        restart: "{{ homepage_config is changed }}"
        # Its health check starts a wget every few seconds, and the Next.js server it runs as
        # PID 1 never reaps them: hundreds of zombies piled up in four days. An init reaps them.
        init: true
        memory: "{{ homepage_memory }}"
        labels:
          traefik.enable: "{{ homepage_available_externally | string }}"
          traefik.http.routers.homepage.rule: "Host(`{{ homepage_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.homepage.tls.certresolver: "letsencrypt"
          traefik.http.routers.homepage.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.homepage.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.homepage.loadbalancer.server.port: "3000"
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: homepage_enabled is true
- name: Stop Homepage
  block:
    - name: Stop Homepage
      community.docker.docker_container:
        name: "{{ homepage_container_name }}"
        state: absent
  when: homepage_enabled is false
