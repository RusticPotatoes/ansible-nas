---
prowlarr_enabled: false
prowlarr_available_externally: false

# directories
prowlarr_data_directory: "{{ docker_home }}/prowlarr/config"

# uid / gid
prowlarr_user_id: "0"
prowlarr_group_id: "0"

# network
prowlarr_port: "9696"
prowlarr_hostname: "prowlarr"

# docker
prowlarr_container_name: "prowlarr"
prowlarr_image_name: "ghcr.io/linuxserver/prowlarr"
# Pinned: the VPN stack is out of Watchtower and updated by the playbook (docs: gluetun).
prowlarr_image_version: "2.7.0.5723-ls166"

# specs
prowlarr_memory: 1g
