---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Include the role's defaults
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ endora_audio_container_name }}"
      register: result

    - name: Ask the hub whether it is up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ endora_audio_port }}/health"
        return_content: true
      register: health
      until: health.status == 200
      retries: 10
      delay: 2

    - name: Ask for its state without the token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ endora_audio_port }}/v1/state"
        status_code: 401

    - name: Check the hub is running and answers
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false
          - health.json.ok
