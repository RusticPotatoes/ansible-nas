---
sonarr_enabled: false
sonarr_available_externally: false

# directories
sonarr_data_directory: "{{ docker_home }}/sonarr/config"
sonarr_tv_directory: "{{ tv_root }}"
sonarr_download_directory: "{{ downloads_root }}"

# uid / gid
sonarr_user_id: "0"
sonarr_group_id: "0"

# network
sonarr_port: "8989"
sonarr_hostname: "sonarr"

# docker
sonarr_container_name: "sonarr"
sonarr_image_name: "linuxserver/sonarr"
# Pinned: the VPN stack is out of Watchtower and updated by the playbook (docs: gluetun).
sonarr_image_version: "4.0.20.3014-ls2"

# specs
sonarr_memory: 1g

# logging
# Sonarr 4.0.20's console log does not scrub API keys (its file log does): a 429 from an indexer
# prints the whole Torznab URL, Prowlarr's key included, at Warn. Error keeps it out of
# `docker logs` and Loki; raise it only on a build whose console cleanses (as Radarr's does).
sonarr_console_log_level: "Error"
