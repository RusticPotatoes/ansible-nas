---
- name: Start NZBget
  block:
    - name: Create NZBget config directory
      ansible.builtin.file:
        path: "{{ nzbget_data_directory }}"
        state: directory
        owner: "{{ nzbget_user_id }}"
        group: "{{ nzbget_group_id }}"
        mode: "0775"
        recurse: true

    - name: Create NZBget download directory
      ansible.builtin.file:
        path: "{{ nzbget_download_directory }}"
        state: directory
        owner: "{{ nzbget_user_id }}"
        group: "{{ nzbget_group_id }}"
        mode: "0775"

    - name: NZBGet
      community.docker.docker_container:
        name: "{{ nzbget_container_name }}"
        image: "{{ nzbget_image_name }}:{{ nzbget_image_version }}"
        pull: true
        volumes:
          - "{{ nzbget_download_directory }}:/downloads:rw"
          - "{{ nzbget_data_directory }}:/config:rw"
        ports: "{{ [nzbget_port ~ ':6789'] if not (vpn_download_stack_enabled | default(false) | bool) else omit }}"
        network_mode: "{{ gluetun_name if (vpn_download_stack_enabled | default(false) | bool) else omit }}"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          PUID: "{{ nzbget_user_id }}"
          PGID: "{{ nzbget_group_id }}"
        restart_policy: unless-stopped
        memory: "{{ nzbget_memory }}"
        labels:
          traefik.enable: "{{ nzbget_available_externally | string }}"
          traefik.http.routers.nzbget.rule: "Host(`{{ nzbget_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.nzbget.tls.certresolver: "letsencrypt"
          traefik.http.routers.nzbget.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.nzbget.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.nzbget.loadbalancer.server.port: "6789"
          homepage.group: Download Tools
          homepage.name: NZBGet
          homepage.icon: nzbget
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ nzbget_port }}"
          homepage.description: Usenet downloader
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: nzbget_enabled is true
- name: Stop NZBget
  block:
    - name: Stop NZBget
      community.docker.docker_container:
        name: "{{ nzbget_container_name }}"
        state: absent
  when: nzbget_enabled is false
