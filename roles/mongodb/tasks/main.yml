---
- name: Start MongoDB
  block:
    - name: Require the MongoDB root password to be set
      ansible.builtin.assert:
        that:
          - vault_mongodb_root_password is defined
          - vault_mongodb_root_password | length > 0
        fail_msg: "vault_mongodb_root_password must be set (vault or inventory); this role keeps no default for it."
        quiet: true

    - name: Ensure MongoDB directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ mongodb_directory }}/data/db"

    - name: MongoDB Docker Container
      community.docker.docker_container:
        name: mongodb
        image: "{{ mongodb_image_name }}:{{ mongodb_image_version }}"
        pull: true
        user: "{{ mongodb_user_id }}:{{ mongodb_group_id }}"
        volumes:
          - "{{ mongodb_directory }}:/data/db:rw"
        ports:
          - "{{ mongodb_port }}:27017"
        env:
          TZ: "{{ mongodb_timezone }}"
          MONGODB_INITDB_ROOT_USERNAME: "{{ mongodb_user }}"
          MONGODB_INITDB_ROOT_PASSWORD: "{{ mongodb_password }}"
        restart_policy: unless-stopped
      register: docker_container_result
      until: docker_container_result is succeeded
      retries: "{{ docker_container_pull_retries }}"
      delay: "{{ docker_container_pull_delay }}"
  when: mongodb_enabled is true
