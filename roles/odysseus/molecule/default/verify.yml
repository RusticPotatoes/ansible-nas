---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: result
      with_items:
        - "{{ odysseus_container_name }}"
        - "{{ odysseus_chromadb_container_name }}"
        - "{{ odysseus_searxng_container_name }}"

    - name: Check Odysseus, ChromaDB and SearXNG are running
      ansible.builtin.assert:
        that:
          - item.container['State']['Status'] == "running"
          - item.container['State']['Restarting'] == false
      with_items: "{{ result.results }}"
      loop_control:
        label: "{{ item.item }}"
