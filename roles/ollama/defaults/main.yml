---
ollama_enabled: false
ollama_data_directory: "{{ docker_home }}/ollama"
ollama_port: "11434"
ollama_container_name: "ollama"
ollama_image_name: "ollama/ollama"
ollama_image_version: "latest"
# Ceiling for the container. A model on the GPU needs only a few GB of host memory, so this
# is a backstop: a runaway is stopped inside Ollama's own limit instead of starving the
# whole NAS. At 12g, a 16 GB NAS ran out first and the kernel's global OOM killer stalled
# every service for about 25 minutes before it killed the runner.
ollama_memory: 8g

# Host memory, in MiB, that the runner (llama-server) may use to keep earlier prompts for
# reuse. Ollama does not set it, so llama-server's default of 8192 applies: each saved
# prompt took about 250 MB, the cache filled to 8 GB in a day with the model running
# 100% on the GPU, and the kernel killed the runner. The request slots' own cache lives on
# the GPU and is not affected; 0 turns this host cache off.
ollama_prompt_cache_mib: 1024

# Context window, in tokens, available to EACH request. Ollama's default is 4096, and with
# two request slots it is split so a single request only gets about 2,050: anything longer
# is silently truncated from the front, which drops the system prompt and most of a tool
# list. A butler turn that offers tools is routinely 5,000-12,000 tokens, so this needs to
# be well above that. The cost is KV-cache memory per loaded model (roughly 1 GB for a 7B
# at 16k, about 3 GB for a 14B), which on a 12 GB GPU means a 14B model will spill a few
# layers to the CPU.
ollama_context_length: 16384

# Requests a loaded model serves at once. Each gets the whole window above (Ollama sizes the
# cache as window x slots: about 1 GB more per extra slot for a 7B at 16k). With one slot,
# Endora's chat waited behind its own background mail reading (8.9 s for a request that took
# 0.06 s), and each wiped the other's reusable prompt cache; two let them run side by side.
ollama_num_parallel: 2

# How long a model stays loaded after its last request. Ollama's default is 5 minutes, and
# any request that does not say otherwise resets it to that, so the first message after a
# pause paid a 13-second reload on a 7B (measured on the A2000). "-1" keeps a loaded model
# loaded until Ollama needs the memory for another one; a duration such as "1h" also works.
ollama_keep_alive: "-1"
