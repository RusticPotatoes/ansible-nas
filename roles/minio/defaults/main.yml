---
# enable or disable the application
minio_enabled: false
minio_available_externally: false

# directories
minio_data_directory: "{{ docker_home }}/minio"

# env
minio_admin_username: admin
minio_admin_password: supersecure

# network
minio_hostname: "minio"
minio_network_name: "minio"
minio_api_port: "9001"
minio_console_port: "9009"

# docker
minio_container_name: "minio"
# MinIO stopped publishing images and removed minio/minio from Docker Hub.
# Silo is a maintained fork with the same S3 API, env vars and on-disk format.
minio_image_name: "pgsty/silo"
minio_image_version: "RELEASE.2026-09-16T00-00-00Z"

# specs
minio_memory: "1g"
