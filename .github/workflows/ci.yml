---
name: CI

# Controls when the action will run.
on:
  # Every pushed branch, so a branch is checked before it is proposed; and pull requests to the
  # fork's base branch (develop) and to main.
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip3 install ansible yamllint==1.30.0 ansible-lint==6.14.6

      - name: Ansible-lint
        run: ansible-lint nas.yml

      - name: Lint yaml files
        run: yamllint .

      # tests/test_lint_rules.py: the rules in tests/lint_rules, against their fixtures.
      - name: Test the fork's own lint rules
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'

      - name: Lint docs
        uses: articulate/actions-markdownlint@v1
        with:
          version: 0.32.2
