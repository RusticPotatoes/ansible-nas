# Running the playbook from another machine (a laptop) over SSH, instead of on the NAS itself:
#   make run-remote TAGS=<roles>
# The NAS is reached by its name on the house's DNS (Pi-hole's declared nas.home.arpa); the
# SSH user is the NAS user from group_vars/all.yml.
[nas]
ansible-nas ansible_host=nas.home.arpa ansible_user="{{ ansible_nas_user }}"
