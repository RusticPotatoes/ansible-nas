# Add your all.yml config overrides to this file. See group_vars/all.yml for all possible settings.

# Example options
ansible_nas_hostname: ansible-nas
ansible_nas_timezone: "America/New_York"

# main eth device
primary_eth: "enp6s0"

# ansible_os_family: "Debian"

# Keep host-level lookups, including Docker image pulls, independent of
# Pi-hole/router DNS. More-specific local DNS domains learned from the network
# still win over this catch-all route.
ansible_nas_configure_systemd_resolved: true

# Keep container DNS independent of local DNS/Pi-hole availability.
# Docker image pulls use the host resolver configured by ansible-nas-general.
docker_daemon_json:
  data-root: "{{ docker_image_directory }}"
  storage-driver: "{{ docker_storage_driver }}"
  dns:
    - "1.1.1.1"
    - "1.0.0.1"

# Secrets expected from vault.yml. Keep the vault file ignored and pass it with
# `make deploy` / `make tags`.
minio_admin_username: "{{ vault_minio_admin_username | default('admin') }}"
minio_admin_password: "{{ vault_minio_admin_password | mandatory }}"
pihole_web_password: "{{ vault_pihole_web_password | mandatory }}"
postgres_user: "{{ vault_postgres_user | default('postgres') }}"
postgres_password: "{{ vault_postgres_password | mandatory }}"
semaphore_admin_user: "{{ vault_semaphore_admin_user | default('admin') }}"
semaphore_admin_password: "{{ vault_semaphore_admin_password | mandatory }}"
semaphore_admin_email: "{{ vault_semaphore_admin_email | default('admin@localhost') }}"

## Enable some applications
homepage_enabled: true
portainer_enabled: true
homeassistant_enabled: true
plex_enabled: true
gluetun_enabled: true
gluetun_periodic_restart_enabled: true
gluetun_periodic_restart_interval: "2h"
radarr_enabled: true
sonarr_enabled: true
stats_enabled: true
deluge_enabled: true
nzbget_enabled: true
logging_enabled: true
prowlarr_enabled: true
vpn_download_stack_enabled: true
vpn_download_stack_user_id: "999"
vpn_download_stack_group_id: "1001"
prowlarr_user_id: "{{ vpn_download_stack_user_id }}"
prowlarr_group_id: "{{ vpn_download_stack_group_id }}"
deluge_user_id: "{{ vpn_download_stack_user_id }}"
deluge_group_id: "{{ vpn_download_stack_group_id }}"
radarr_user_id: "{{ vpn_download_stack_user_id }}"
radarr_group_id: "{{ vpn_download_stack_group_id }}"
sonarr_user_id: "{{ vpn_download_stack_user_id }}"
sonarr_group_id: "{{ vpn_download_stack_group_id }}"
nzbget_user_id: "{{ vpn_download_stack_user_id }}"
nzbget_group_id: "{{ vpn_download_stack_group_id }}"
minio_enabled: true
loki_enabled: true
logging_stack_enabled: true
homebridge_enabled: true
grafana_enabled: true
promtail_enabled: true
semaphore_enabled: false
dashy_enabled: false
organizr_enabled: true
overseerr_enabled: false
thelounge_enabled: true
unifi_enabled: true
mongodb_enabled: true
pihole_enabled: true
wireguard_enabled: true
# readarr_enabled: true
watchtower_enabled: true
newspaper_enabled: true
ebook2audiobook_enabled: true
ebook2audiobook_auto_convert_enabled: true
ebook2audiobook_auto_convert_interval: "30m"
postgres_enabled: true
librechat_enabled: false

# Observability
#
# The stats role already collects host and Docker metrics for every enabled
# service via Telegraf, and the logging stack ships every container's stdout
# logs to Loki via Promtail. These jobs add native Prometheus endpoints for the
# enabled services in this NAS that expose them.
stats_prometheus_scrape_jobs:
  - name: "loki"
    metrics_path: "/metrics"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ loki_http_port }}"

  - name: "promtail"
    metrics_path: "/metrics"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ promtail_port }}"

  - name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ minio_api_port }}"

# Uncomment after creating a Home Assistant long-lived access token and enabling
# the Prometheus integration in Home Assistant.
# stats_hass_long_lived_access_token: "replace-me"

lan_subnets: "{{ ansible_nas_subnet }}"

# Extra browseable read-only Samba shares for the top-level mounted filesystems.
# Existing media sub-shares keep their current writable behavior.
samba_extra_shares:
  - name: media-root
    comment: "Top-level media mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/media
    directory_mode: "0755"

  - name: docker-root
    comment: "Top-level Docker data mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/docker
    directory_mode: "0755"

  - name: archive-root
    comment: "Top-level archive mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/archive
    directory_mode: "0755"
