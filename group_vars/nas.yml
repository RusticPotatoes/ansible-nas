##     a n s i b l e - n a s      https://github.com/davestephens/ansible-nas

# Add your all.yml config overrides to this file. See group_vars/all.yml for all possible settings.

# Example options
ansible_nas_hostname: ansible-nas
ansible_nas_timezone: "America/New_York"

# main eth device
primary_eth: "enp6s0"

# ansible_os_family: "Debian"

# Keep host-level lookups, including Docker image pulls, independent of
# Pi-hole/router DNS. More-specific local DNS domains learned from the network
# still win over this catch-all route.
ansible_nas_configure_systemd_resolved: true
ansible_nas_resolved_use_uplink_resolv_conf: true
ansible_nas_resolved_dns_servers:
  - "1.1.1.1"
  - "9.9.9.9"
ansible_nas_resolved_fallback_dns_servers:
  - "1.1.1.1"
  - "9.9.9.9"

# Keep container DNS independent of local DNS/Pi-hole availability.
# Docker image pulls use the host resolver configured by ansible-nas-general.
docker_daemon_json:
  # cgroupfs driver keeps GPU containers from losing access on systemctl
  # daemon-reload (nvidia-container-toolkit cgroup bug, GitHub issue #48).
  exec-opts:
    - "native.cgroupdriver=cgroupfs"
  data-root: "{{ docker_image_directory }}"
  storage-driver: "{{ docker_storage_driver }}"
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  dns:
    - "1.1.1.1"
    - "1.0.0.1"

# Keep Docker's image/cache sprawl under control. Volumes are not pruned.
docker_prune_enabled: true
docker_prune_interval: "Sun *-*-* 04:30:00"
docker_prune_until: "168h"

# Let Ubuntu apply routine updates unattended and reboot only when packages
# leave /var/run/reboot-required behind.
ansible_nas_unattended_upgrades_enabled: true
ansible_nas_unattended_reboot: true
ansible_nas_unattended_reboot_time: "04:00"

# Secrets expected from vault.yml. Keep the vault file ignored and pass it with
# `make deploy` / `make tags`.
minio_admin_username: "{{ vault_minio_admin_username | default('admin') }}"
minio_admin_password: "{{ vault_minio_admin_password | mandatory }}"
pihole_web_password: "{{ vault_pihole_web_password | mandatory }}"
postgres_user: "{{ vault_postgres_user | default('postgres') }}"
postgres_password: "{{ vault_postgres_password | mandatory }}"
semaphore_admin_user: "{{ vault_semaphore_admin_user | default('admin') }}"
semaphore_admin_password: "{{ vault_semaphore_admin_password | mandatory }}"
semaphore_admin_email: "{{ vault_semaphore_admin_email | default('admin@localhost') }}"
ansible_nas_user_password: "{{ ansible_become_password }}"

## Enable some applications
homepage_enabled: true

# Homepage dashboard
# Disk usage: mount the arrays read-only; /app/config already sits on /mnt/docker
homepage_extra_volumes:
  - /mnt/media:/mnt/media:ro
  - /mnt/archive:/mnt/archive:ro

homepage_services_yaml:
  - Alerts:
      - Firing alerts:
          icon: mdi-bell-alert-outline
          href: "http://{{ ansible_default_ipv4.address }}:{{ stats_prometheus_port }}/alerts"
          description: Prometheus alert rules (storage, system, containers)
          widget:
            type: customapi
            url: "http://{{ ansible_default_ipv4.address }}:{{ stats_prometheus_port }}/api/v1/query?query=ALERTS%7Balertstate%3D%22firing%22%7D"
            refreshInterval: 60000
            display: dynamic-list
            mappings:
              items: data.result
              name: metric.alertname
              label: metric.subject
              limit: 10
  - Networking:
      - Router:
          icon: asus-router
          href: "http://{{ ansible_nas_gateway }}/"
          description: Asus Router

homepage_settings_yaml:
  title: Ansible-NAS
  language: "{{ homepage_locale }}"
  theme: dark
  color: slate
  headerStyle: clean
  statusStyle: dot
  showStats: false
  hideVersion: true
  useEqualHeights: true
  layout:
    Alerts:
      style: row
      columns: 1
    Media:
      style: row
      columns: 2
    Download Tools:
      style: row
      columns: 4
    Networking:
      style: row
      columns: 4
    Monitoring:
      style: row
      columns: 4
    AI:
      style: row
      columns: 3
    Home:
      style: column
    Storage:
      style: column
    System Tools:
      style: column

homepage_widgets_yaml:
  - resources:
      label: System
      cpu: true
      memory: true
      cputemp: true
      uptime: true
      units: metric
      refresh: 10000
  - resources:
      label: Media
      disk: /mnt/media
  - resources:
      label: Archive
      disk: /mnt/archive
  - resources:
      label: Docker
      disk: /app/config
  - search:
      provider: google
      focus: true
      target: _blank
  - datetime:
      text_size: l
      format:
        dateStyle: medium
        timeStyle: short

homepage_bookmarks_yaml:
  - NAS:
      - Ansible-NAS repo:
          - icon: github
            href: https://github.com/RusticPotatoes/ansible-nas
      - Ansible-NAS docs:
          - abbr: AN
            href: https://ansible-nas.io/
      - Homepage docs:
          - icon: homepage
            href: https://gethomepage.dev/
  - Network:
      - Router:
          - icon: asus-router
            href: "http://{{ ansible_nas_gateway }}/"
      - Cloudflare:
          - icon: cloudflare
            href: https://dash.cloudflare.com/
      - Docker Hub:
          - icon: docker
            href: https://hub.docker.com/
portainer_enabled: true
homeassistant_enabled: true
plex_enabled: true
plex_nvidia_gpu: true
gluetun_enabled: true
gluetun_periodic_restart_enabled: true
gluetun_periodic_restart_interval: "2h"
# No playbook run from the restart (it needed the vault password on the NAS, and never ran):
# a routed container that fails to start makes the restart fail, so it is seen and fixed.
gluetun_recover_with_ansible_enabled: false
radarr_enabled: true
sonarr_enabled: true
stats_enabled: true
deluge_enabled: true
nzbget_enabled: true
logging_enabled: true
prowlarr_enabled: true
vpn_download_stack_enabled: true

# Decouple step 1: radarr/sonarr orchestrate only (scraping is in prowlarr,
# downloading in deluge/nzbget) so they don't need the VPN. Keep them enabled
# but off gluetun's namespace, so recreating gluetun no longer cascades to them.
radarr_vpn_enabled: false
sonarr_vpn_enabled: false
# Let gluetun's killswitch permit the LAN (not the internet) so prowlarr, still
# inside the VPN, can reach radarr/sonarr (now outside) for indexer sync.
gluetun_firewall_outbound_subnets: "192.168.3.0/24"

# FlareSolverr solves Cloudflare challenges for Prowlarr indexers (e.g. EZTV).
# Routed through gluetun so it shares Prowlarr's VPN exit IP (cf_clearance is IP-bound).
flaresolverr_enabled: true
flaresolverr_memory: "1g"
vpn_download_stack_user_id: "999"
vpn_download_stack_group_id: "1001"
prowlarr_user_id: "{{ vpn_download_stack_user_id }}"
prowlarr_group_id: "{{ vpn_download_stack_group_id }}"
deluge_user_id: "{{ vpn_download_stack_user_id }}"
deluge_group_id: "{{ vpn_download_stack_group_id }}"
radarr_user_id: "{{ vpn_download_stack_user_id }}"
radarr_group_id: "{{ vpn_download_stack_group_id }}"
sonarr_user_id: "{{ vpn_download_stack_user_id }}"
sonarr_group_id: "{{ vpn_download_stack_group_id }}"
nzbget_user_id: "{{ vpn_download_stack_user_id }}"
nzbget_group_id: "{{ vpn_download_stack_group_id }}"
minio_enabled: true
loki_enabled: true
logging_stack_enabled: true
homebridge_enabled: true
grafana_enabled: true
promtail_enabled: true
semaphore_enabled: false   # retired 2026-10-18: broken since April; the NAS is managed from elsewhere
owntone_enabled: false   # retired 2026-10-17: Endora's sound hub plays the HomePods and Spotify now
overseerr_enabled: true
thelounge_enabled: true
unifi_enabled: true
mongodb_enabled: true
pihole_enabled: true
# Declared, not clicked: the node's name (this NAS); and the router answers for each device's
# own name (<device>.home), which follows it when its address moves. Addresses come from the
# NAS's own facts at run time, so none is written here.
pihole_dns_hosts:
  - "{{ ansible_default_ipv4.address }} endora.home.arpa"
  - "{{ ansible_default_ipv4.address }} nas.home.arpa"   # the machine, for running the playbook from elsewhere
pihole_rev_servers:
  - "true,{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix }},{{ ansible_default_ipv4.gateway }},home"
wireguard_enabled: true
watchtower_enabled: true

# The house's vault beside the Endora node (Endora ADR 0127): Endora initialises it and
# unlocks it with the owner's passkey.
openbao_enabled: true

# Backups: Backrest (restic) to the archive array, everything that matters
backrest_enabled: true
backrest_sources:
  - { host: "{{ docker_home }}", container: /sources/docker }
  - { host: /mnt/media, container: /sources/media }
  - { host: "/home/{{ ansible_nas_user }}", container: /sources/home }   # the NAS user's home, wherever the playbook runs from
  - { host: /etc, container: /sources/etc }
backrest_plans:
  - id: system   # app configs/databases, home (incl. this repo + vault), /etc
    paths: [/sources/docker, /sources/home, /sources/etc]
    excludes:
      - /sources/docker/docker-data/overlay2
      - /sources/docker/docker-data/image
      - /sources/docker/docker-data/containers
      - /sources/docker/docker-data/buildkit
      - /sources/docker/docker-data/tmp
      - /sources/docker/backrest/cache
      - /sources/docker/ollama/models
      - /sources/docker/stats/prometheus/data
      - /sources/docker/nzbget/tmp
      - "**/Plex Media Server/Cache"
      - "**/Plex Media Server/Codecs"
      - "**/Plex Media Server/Crash Reports"
      - "**/Transcode"
      - /sources/home/backups
      - /sources/home/.cache
    cron: "0 2 * * *"
    retention: { daily: 14, weekly: 8, monthly: 12 }
  - id: media
    paths: [/sources/media]
    excludes:
      - /sources/media/downloads/intermediate
      - "*.part"
      - "*.!qB"
    cron: "30 3 * * *"
    retention: { daily: 7, weekly: 4, monthly: 6 }

# Host upkeep
nas_status_directory: "{{ docker_home }}/nas-status"
nas_btrfs_scrub_mountpoints: [/mnt/media, /mnt/archive]
nas_hold_nvidia_driver: true
nas_db_dumps_enabled: true
nas_db_dump_postgres_container: ""   # postgres retired 2026-10-18 (semaphore's only)
nas_db_dump_mongodb_container: mongodb
newspaper_enabled: true
ebook2audiobook_enabled: false   # off for now: the NAS is short of memory (2026-10-16)
ebook2audiobook_auto_convert_enabled: false   # disabled: slow XTTS churn; revisit with Kokoro-FastAPI engine
ebook2audiobook_auto_convert_interval: "30m"
postgres_enabled: false   # retired 2026-10-18 with semaphore, its only user
gatus_enabled: true

# Observability
#
# The stats role already collects host and Docker metrics for every enabled
# service via Telegraf, and the logging stack ships every container's stdout
# logs to Loki via Promtail. These jobs add native Prometheus endpoints for the
# enabled services in this NAS that expose them.
stats_prometheus_scrape_jobs:
  - name: "loki"
    metrics_path: "/metrics"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ loki_http_port }}"

  - name: "promtail"
    metrics_path: "/metrics"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ promtail_port }}"

  - name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    targets:
      - "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}:{{ minio_api_port }}"

# Uncomment after creating a Home Assistant long-lived access token and enabling
# the Prometheus integration in Home Assistant.
# stats_hass_long_lived_access_token: "replace-me"

lan_subnets: "{{ ansible_nas_subnet }}"

# Extra browseable read-only Samba shares for the top-level mounted filesystems.
# Existing media sub-shares keep their current writable behavior.
samba_extra_shares:
  - name: media-root
    comment: "Top-level media mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/media
    directory_mode: "0755"

  - name: docker-root
    comment: "Top-level Docker data mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/docker
    directory_mode: "0755"

  - name: archive-root
    comment: "Top-level archive mount"
    guest_ok: yes
    public: yes
    writable: no
    read_only: yes
    write_list: "{{ ansible_nas_user }}"
    user: "{{ samba_guest_account }}"
    browseable: yes
    path: /mnt/archive
    directory_mode: "0755"

# Local AI stack (GPU). Codified from the containers stood up by hand.
ollama_enabled: true
open_webui_enabled: true
kokoro_fastapi_enabled: true
faster_whisper_enabled: false   # off: nothing uses it, and it ran on the CPU (2026-10-16)
whisperlive_enabled: false      # off: Endora no longer calls it since push-to-talk went (2026-10-16)

# Cloudflare Tunnel for remote access (replaces the exposed WireGuard port).
# Deploys once vault_cloudflared_tunnel_token is set in vault.yml.
cloudflared_enabled: true
